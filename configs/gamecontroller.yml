Includes:
  - './base.yml'

Defs: '../definitions/macos/gamecontroller.json'

Cpp:
  Emit: false
  ExportInternals: true
  DontWrapCFunctions: true
  ExportForwardDeclarations: true
  ExportTypes:
    - '^_*GC.+'
  ExportMethods:
    - '^::GC.+'
  ExportVars:
    - '^::k?GC.+'

Odin:
  ExternalTypes:
    - '../exports/CoreFoundation.exports.yml'
    - '../exports/CoreGraphics.exports.yml'
    - '../exports/AppKit.exports.yml'
  ResolvedTypedefs:
    - '[su]?int.*'

  Packages:
    - Name: 'GameController'
      Export: 'GC'
      LinkLibs:
        - 'system:GameController.framework'
      Filter: '.*'
      Imports:
        - |2

            CHHapticEngine :: NS.Object
            IOHIDDeviceRef :: struct {}
      TypeMap:
        CHHapticEngine: 'CHHapticEngine'
        IOHIDDeviceRef: 'IOHIDDeviceRef'

  EnumTransforms:
    - Type: '.*'
      Transforms:
        - {Kind: 'RemovePartialTypeNamePrefix'}
        - {Kind: 'RemoveUnderscorePrefix'}
        - {Kind: 'UnderscoreNumbers'}

    # Restore complete SDK words after the generic enum-name transforms.
    - Type: '^GCControllerHomeButtonSettingsCustomizationActivity$'
      Transforms:
      - { Kind: ReplacePrefix, Source: eInAppActionActivity, Target: CustomizeInAppActionActivity }
      - { Kind: ReplacePrefix, Source: eSystemActionActivity, Target: CustomizeSystemActionActivity }

  TypeTransforms:
    - Type: '^(GC).+'
      Transforms: [{Kind: 'RemovePrefix', Source: '$group0'}]
    - Type: 'Flag$' # Transforms for bit_set types
      Transforms: [{Kind: 'AppendSuffix', Source: 's'}]
    - Type: 'Mask$'
      Transforms: [{Kind: 'None'}]

  BitSetMap:
    # SDK 27 flag declarations, verified against the headers named below.
    # GCPhysicalInputSource.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^GCPhysicalInputSourceDirection$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # GCEventInteraction.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^GCUIEventTypes$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    - Type: 'Flags?$'
      Transforms: [{Kind: 'RemoveSuffix', Source: 's'}]
    - Type: 'Mask$'
      Transforms: [{Kind: 'AppendSuffix', Source: 'Flag'}]

  ProcTransforms:
    - Type: '^(_*GC).+'
      Transforms: [{Kind: 'RemovePrefix', Source: '$group0'}]

  VarTransforms:
    - Type: '^(_*GC).+'
      Transforms: [{Kind: 'RemovePrefix', Source: '$group0'}]
