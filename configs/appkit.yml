---

Defs: ../definitions/macos/appkit.json

Mono  : { Emit: false }
CSharp: { Emit: false }

Cpp:
  Emit: false
  ExportInternals: true
  DontWrapCFunctions: true
  ExportForwardDeclarations: true
  
  ExportTypes:
    - ^_*NS.+

  ExportMethods:
    - ^::NS.+

  ExportVars:
    - ^::k?NS.+

  IgnoreTypes  : []
  IgnoreMethods: []


Odin:
  Emit             : true
  ExportPath       : ..
  BasePackageName  : darwodin
  SingleFile       : false
  EmitObjCExtenders: true
  TargetPlatform   : Darwin
  ExportTypeMapDir : ../exports
  ExternalTypes:
    - ../mach/exports/mach.exports.yml
    - ../libc/libc.exports.yml
    - ../exports/CoreFoundation.exports.yml
    - ../exports/CoreGraphics.exports.yml
    - ../exports/CoreText.exports.yml
    - ../exports/CoreMedia.exports.yml  # TODO: This is for IconRef. Remove it once we had LaunchServices.framework
    - ../exports/Security.exports.yml
    - ../exports/Foundation.exports.yml
    - ../exports/QuartzCore.exports.yml

  ExternalPackageMap: { darwin_libc: '../libc' }

  ReExportPackages: [ Foundation ]

  ResolvedTypedefs:
    - '[su]?int.*'

  Packages:
    - Name  : AppKit
      Export: NS
      LinkLibs: [system:AppKit.framework]
      Filter: .*

      Imports:
        - |
          OpaqueSecTransformImplementation :: struct {}
          OpaqueSecIdentitySearchRef       :: struct {}
          OpaquePolicySearchRef            :: struct {}
          CVTimeStamp                      :: struct {}

          CIBarcodeDescriptor :: NS.Object
          CKShare             :: NS.Object
          CKContainer         :: NS.Object
          CIImage             :: NS.Object
          INIntent            :: NS.Object
          CIColor             :: NS.Object
          CIFilter            :: NS.Object
          CIContext           :: NS.Object
          CKShareMetadata     :: NS.Object
          QTMovie             :: NS.Object
          UTType              :: NS.Object

          GCGamepadSnapShotDataV100         :: struct {}
          GCExtendedGamepadSnapshotData     :: struct {}
          GCExtendedGamepadSnapShotDataV100 :: struct {}
          GCMicroGamepadSnapshotData        :: struct {}
          GCMicroGamepadSnapShotDataV100    :: struct {}

          // Helper array iterator
          Array_Iterator :: struct($T: typeid) {
              array: ^NS.Array,
              length: int,
              index:  int,
          }

          array_iter :: proc( $T: typeid, array: ^NS.Array ) -> Array_Iterator(T) {
              return Array_Iterator(T) {
                  array  = array,
                  length = int(array->count()),
                  index  = 0,
              }
          }

          array_next :: proc( it: ^Array_Iterator($T) ) -> (val: ^T, idx: int, cond: bool) {
              if it.index >= it.length {
                  return
              }

              val      = auto_cast it.array->objectAtIndex(auto_cast it.index)
              idx      = it.index
              cond     = true
              it.index += 1
              return
          }

          to_ns_string :: #force_inline proc "contextless" ( str: string ) -> ^String {
              return String.alloc()->initWithBytes(raw_data(str), UInteger(len(str)), UTF8StringEncoding)
          }

          to_ns_string_no_copy :: #force_inline proc "contextless" ( str: string ) -> ^String {
              return String.alloc()->initWithBytesNoCopy(raw_data(str), UInteger(len(str)), UTF8StringEncoding, false)
          }

          to_odin_string :: proc( ns_str: ^String, allocator := context.allocator ) -> string {
              length := ns_str->lengthOfBytesUsingEncoding(UTF8StringEncoding)
              dest := make([]u8, int(length)+1, allocator)

              runtime.mem_copy_non_overlapping(raw_data(dest), rawptr(ns_str->UTF8String()), int(length))
              return string(dest[:length])
          }

          tmp_to_odin_string :: #force_inline proc ( ns_str: ^String ) -> string {
              return to_odin_string(ns_str, context.temp_allocator)
          }

          STR :: #force_inline proc "contextless" ( #const s: cstring ) -> ^String {
              return auto_cast CF.STR(s)
          }


  
        - |
          // Composite SDK masks that also contain reserved or unnamed bits.
          TouchPhase_Any :: transmute(TouchPhase)max(cffi.ulong)
          DragOperation_Every :: transmute(DragOperation)max(cffi.ulong)
          LineBreakStrategy_Standard :: transmute(LineBreakStrategy)cffi.ulong(65535)
          ControlEvents_AllTrackingEvents :: transmute(ControlEvents)cffi.ulong(4095)
          ControlEvents_ApplicationReserved :: transmute(ControlEvents)cffi.ulong(251658240)
          ControlEvents_SystemReserved :: transmute(ControlEvents)cffi.ulong(4026531840)
          ControlEvents_AllEvents :: transmute(ControlEvents)cffi.ulong(4294967295)
          UnderlineStyle_Double :: transmute(UnderlineStyle)cffi.long(9)

      TypeMap:
        CKShare: CKShare
        CKShareMetadata: CKShareMetadata
        CKContainer: CKContainer
        INIntent: INIntent
        CIImage: CIImage
        CIColor: CIColor
        CIFilter: CIFilter
        CIContext: CIContext
        QTMovie: QTMovie
        UTType: UTType
        CVTimeStamp: CVTimeStamp

        # CG
        GCGamepadSnapShotDataV100: GCGamepadSnapShotDataV100
        GCExtendedGamepadSnapshotData: GCExtendedGamepadSnapshotData
        GCExtendedGamepadSnapShotDataV100: GCExtendedGamepadSnapShotDataV100
        GCMicroGamepadSnapshotData: GCMicroGamepadSnapshotData
        GCMicroGamepadSnapShotDataV100: GCMicroGamepadSnapShotDataV100

      IgnoreExtendObjCTypes:
        - ^NSOpenGLLayer$

  # Symbol Transformers
  EnumTransforms:
  # SDK 27 adds fully qualified names while retaining the deprecated aliases.
  - Type: ^NSTextBlock(Dimension|Layer)$
    Transforms:
    - { Kind: RemovePrefix, Source: NSTextBlockDimension }
    - { Kind: RemovePrefix, Source: NSTextBlockLayer }
    - { Kind: ReplacePrefix, Source: NSTextBlock, Target: DEPRECATED_ }
  - Type: ^NSEventModifierFlags$
    Transforms:
    - Kind  : RemovePrefix
      Source: NSEventModifierFlag
  - Type: ^NSFontAssetRequestOptions$
    Transforms:
    - Kind  : RemovePrefix
      Source: NSFontAssetRequestOption
  - Type: ^NSApplicationPrintReply$
    Transforms:
    - Kind  : RemovePrefix
      Source: NSPrinting
  - Type: ^NSImageScaling$
    Transforms:
    - Kind  : ReplacePrefix
      Source: NSScale
      Target: DEPRECATED_
    - Kind  : RemovePrefix
      Source: NSImageScale
  - Type: .*
    Transforms:
      - Kind  : RemoveTypeWordsFromElements
      # - Kind  : RemovePartialTypeNamePrefix
      - Kind  : RemoveUnderscorePrefix
      - Kind  : UnderscoreNumbers
  - Type: Flags$
    Transforms:
      - Kind  : RemovePrefix
        Source: Flag

  # Restore SDK words truncated by the generic plural type-name transforms.
  - Type: '^NSControlEvents$'
    Transforms:
    - { Kind: ReplacePrefix, Source: ystemReserved, Target: SystemReserved }
  - Type: '^NSTextStorageEditActions$'
    Transforms:
    - { Kind: ReplacePrefix, Source: edAttributes, Target: EditedAttributes }
    - { Kind: ReplacePrefix, Source: edCharacters, Target: EditedCharacters }

  # Restore complete SDK words after the generic enum-name transforms.
  - Type: '^NSScrollArrowPosition$'
    Transforms:
    - { Kind: ReplacePrefix, Source: erArrows, Target: ScrollerArrows }

  # Remove redundant singular type words left by the plural SDK names.
  - Type: '^NSMenuProperties$'
    Transforms:
    - { Kind: RemovePrefix, Source: Property }
  - Type: '^NSControlEvents$'
    Transforms:
    - { Kind: RemovePrefix, Source: Event }
  - Type: '^NSFontDescriptorSymbolicTraits$'
    Transforms:
    - { Kind: RemovePrefix, Source: Trait }

  TypeTransforms:
    - Type: ^(NS).+
      Transforms:
      - Kind  : RemovePrefix
        Source: $group0
    - Type: Flag$ # Transforms for bit_set types
      Transforms:
      - Kind  : AppendSuffix
        Source: s
    - Type: Mask$
      Transforms:
      - Kind  : None

  BitSetMap:
    # SDK 27 flag declarations, verified against the headers named below.
    # NSTouch.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSTouchPhase$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSEvent.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSEventPhase$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSDragging.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSDragOperation$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSParagraphStyle.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSLineBreakStrategy$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSCell.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSCellHitResult$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSMenu.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSMenuProperties$'
      Transforms: [{ Kind: ReplaceSuffix, Source: ies, Target: y }]
    # NSApplication.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSApplicationOcclusionState|NSRemoteNotificationType)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSControl.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSControlEvents$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    # NSCollectionView.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSCollectionViewScrollPosition$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSCollectionViewCompositionalLayout.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSDirectionalRectEdge$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSDirection.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSHorizontalDirections|NSVerticalDirections)$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    # NSFontDescriptor.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSFontDescriptorSymbolicTraits$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    # NSFontCollection.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSFontCollectionVisibility$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSWindow.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSWindowCollectionBehavior|NSWindowOcclusionState)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSBitmapImageRep.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSBitmapFormat$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSCursor.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSCursorFrameResizeDirections$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    # NSMediaLibraryBrowserController.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSMediaLibrary$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSScreen.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSScreenTouchCapabilities$'
      Transforms: [{ Kind: ReplaceSuffix, Source: ies, Target: y }]
    # NSAttributedString.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSUnderlineStyle$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSTextStorage.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSTextStorageEditActions$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    # NSLayoutManager.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSGlyphProperty|NSControlCharacterAction)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSTextView.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSTextAttachmentViewProviderReusePolicy$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSTableView.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSTableViewGridLineStyle$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSTextSelectionNavigation.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSTextSelectionNavigationModifier$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSStatusItem.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSStatusItemBehavior$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSTypesetter.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSTypesetterControlCharacterAction$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    - Type: Flags?$
      Transforms:
        - Kind  : RemoveSuffix
          Source: s
    - Type: Mask$
      Transforms:
        - Kind  : ReplaceSuffix
          Source: Mask
          Target: Flag
    - Type: Options$
      Transforms:
        - Kind  : RemoveSuffix
          Source: s
  ProcTransforms:
  - Type: ^(_*NS).+
    Transforms:
    - Kind  : RemovePrefix
      Source: $group0

  VarTransforms:
    - Type: ^(_*NS).+
      Transforms:
        - Kind  : RemovePrefix
          Source: $group0
        - Kind  : RemoveUnderscorePrefix
        - Kind  : UnderscoreNumbers
