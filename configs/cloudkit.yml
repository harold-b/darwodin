---

Defs: ../definitions/macos/cloudkit.json

Mono  : { Emit: false }
CSharp: { Emit: false }

Cpp:
  Emit: false
  ExportInternals: true
  DontWrapCFunctions: true
  ExportForwardDeclarations: true
  
  ExportTypes:
    - ^_*CK.+

  ExportMethods:
    - ^::CK.+

  ExportVars:
    - ^::k?CK.+

  IgnoreTypes  : []
  IgnoreMethods: []


Odin:
  Emit           : true
  ExportPath     : ..
  BasePackageName: darwodin
  SingleFile     : false
  TargetPlatform : Darwin
  ExportTypeMapDir: ../exports
  ExternalTypes:
    - ../exports/CoreFoundation.exports.yml
    - ../exports/Foundation.exports.yml

  ResolvedTypedefs:
    - '[su]?int.*'

  Packages:
    - Name  : CloudKit
      Export: CK
      LinkLibs: [system:CloudKit.framework]
      Filter: .*

      Imports:
        - |
          CLLocation :: struct {}
          CNContact  :: struct {}

      # TypeMap:


  # Symbol Transformers
  EnumTransforms:
    - Type: .*
      Transforms:
      - Kind: RemoveTypeWordsFromElements
      - Kind: RemovePartialTypeNamePrefix
      - Kind: RemoveUnderscorePrefix
      - Kind: UnderscoreNumbers

    # Restore SDK words truncated by the generic plural type-name transforms.
    - Type: '^CKRecordZoneCapabilities$'
      Transforms:
      - { Kind: RemovePrefix, Source: apability }

    # Remove redundant singular type words left by the plural SDK names.
    - Type: '^CKApplicationPermissions$'
      Transforms:
      - { Kind: RemovePrefix, Source: Permission }
    - Type: '^CKRecordZoneCapabilities$'
      Transforms:
      - { Kind: RemovePrefix, Source: Capability }

  TypeTransforms:
    - Type: ^(CK).+
      Transforms:
      - Kind  : RemovePrefix
        Source: $group0
    - Type: (Flag|Option|Mask)$  # Transforms for bit_set types
      Transforms:
      - Kind  : AppendSuffix
        Source: s

  BitSetMap:
    # SDK 27 flag declarations, verified against the headers named below.
    # CKContainer.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CKApplicationPermissions$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    # CKRecordZone.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CKRecordZoneCapabilities$'
      Transforms: [{ Kind: ReplaceSuffix, Source: ies, Target: y }]
    - Type: (Mask|Flags?|Options?)$ # Transforms the enum that will generate a bit_set to not have a collision type
      Transforms:
        - Kind  : RemoveSuffix
          Source: s
 
  ProcTransforms:
  - Type: ^(_*CK).+
    Transforms:
    - Kind  : RemovePrefix
      Source: $group0

  VarTransforms:
    - Type: ^(_*CK).+
      Transforms:
        - Kind  : RemovePrefix
          Source: $group0
