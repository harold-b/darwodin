---

Defs: ../definitions/macos/coregraphics.json

Mono  : { Emit: false }
CSharp: { Emit: false }

Cpp:
  Emit: false
  ExportInternals: true
  DontWrapCFunctions: true
  ExportForwardDeclarations: true
  
  ExportTypes:
    - ^(_*CG|GrafP|OpaqueGraf).*
    - ^ColorSyncProfile
    - ^ColorSyncProfileRef
    - ^_*IOSurface


  ExportMethods:
    - ^::CG.+

  ExportVars:
    - ^::k?CG.+

  IgnoreTypes  : []
  IgnoreMethods: []


Odin:
  Emit           : true
  ExportPath     : ..
  BasePackageName: darwodin
  SingleFile     : false
  TargetPlatform : Darwin
  ExportTypeMapDir: ../exports

  ExternalPackageMap:
    darwin_libc: '../libc'

  ExternalTypes:
    - ../mach/exports/mach.exports.yml
    - ../libc/libc.exports.yml
    - ../exports/CoreFoundation.exports.yml

  ResolvedTypedefs:
    - off_t
    - boolean_t
    - '[su]?int.*'

  NonDistinctTypeDefs:
    - ^CGFloat$

  Packages:
    - Name  : CoreGraphics
      Export: CG
      LinkLibs: [system:CoreGraphics.framework]
      Filter: .*

      Imports:
        - |
          NSObject  :: intrinsics.objc_object
          MTLDevice :: intrinsics.objc_object
          cl_device_id :: struct {}

          when ODIN_PLATFORM_SUBTARGET == .Default {
              @(link_prefix="CG", default_calling_convention="c")
              foreign lib {
                  DisplayCreateUUIDFromDisplayID :: proc( displayID: DirectDisplayID ) -> CF.UUIDRef ---
                  DisplayGetDisplayIDFromUUID :: proc( uuid: CF.UUIDRef ) -> DirectDisplayID ---
              }
          }


      TypeMap:
        NSObject: NSObject
        MTLDevice: MTLDevice
        _cl_device_id: cl_device_id
        io_service_t: mach.port_t


  # Symbol Transformers
  EnumTransforms:
  - Type: ^(CG).+
    Transforms:
    - Kind  : RemovePrefix
      Source: kCG
  - Type: ^(CGPDF).+
    Transforms:
    - Kind  : RemovePrefix
      Source: PDF
  - Type: .*
    Transforms:
    - Kind  : RemoveTypeWordsFromElements
    - Kind  : RemovePartialTypeNamePrefix
    - Kind  : RemoveUnderscorePrefix
    - Kind  : UnderscoreNumbers

  TypeTransforms:
    - Type: ^(CG).+
      Transforms:
      - Kind  : RemovePrefix
        Source: $group0
    - Type: Flag$ # Transforms for bit_set types
      Transforms:
      - Kind  : AppendSuffix
        Source: s
    - Type: Mask$
      Transforms:
      - Kind  : None

  BitSetMap:
    # SDK 27 flag declarations, verified against the headers named below.
    # CGBitmapInfo packs alpha/component/byte-order/pixel-format fields; keep it as an enum.
    # CGGradient.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CGGradientDrawingOptions$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    # CGPDFDocument.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CGPDFAccessPermissions$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    # CGWindow.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:CGWindowListOption|CGWindowImageOption)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # CGDirectDisplay.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CGCaptureOptions$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    # CGDisplayConfiguration.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CGConfigureOption$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # CGRemoteOperation.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CGScreenUpdateOperation$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # CGBitmapContext.h: CGContentInfo accumulates all color models drawn.
    - Type: '^CGColorModel$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    - Type: Flags?$
      Transforms:
        - Kind  : RemoveSuffix
          Source: s
    - Type: Mask$
      Transforms:
        - Kind  : ReplaceSuffix
          Source: Mask
          Target: Flag
 
  ProcTransforms:
  - Type: ^(_*CG).+
    Transforms:
    - Kind  : RemovePrefix
      Source: $group0

  VarTransforms:
    - Type: ^(_*k?CG).+
      Transforms:
        - Kind  : RemovePrefix
          Source: $group0
