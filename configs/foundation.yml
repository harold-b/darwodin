---

Defs: ../definitions/macos/foundation.json

Mono  : { Emit: false }
CSharp: { Emit: false }

Cpp:
  Emit: false
  ExportInternals: true
  DontWrapCFunctions: true
  ExportForwardDeclarations: true
  
  ExportTypes:
    - ^_*NS.+
    - ^.*GrafP
    - ^_?xpc_.+
    - ^unichar
    - ^(Opaque)?AE.+
    - ^AppleEvent
    - ^DescType
    - ^au_asid_t
    - ^AE.+


  ExportMethods:
    - ^::NS.+

  ExportVars:
    - ^::k?NS.+

  IgnoreTypes:
    - ^NSImage$

  IgnoreMethods: []

Odin:
  Emit             : true
  ExportPath       : ..
  BasePackageName  : darwodin
  SingleFile       : false
  EmitObjCExtenders: true
  TargetPlatform   : Darwin
  ExportTypeMapDir : ../exports

  ExternalTypes:
    - ../global.exports.yml
    - ../libc/libc.exports.yml
    - ../exports/CoreFoundation.exports.yml
    - ../exports/CoreGraphics.exports.yml
    - ../exports/Security.exports.yml

  ExternalPackageMap:
    darwin_libc: '../libc'

  NonDistinctTypeDefs:
    - ^NSRange$
    - ^NSZone$
    - ^unichar$
    - ^Integer$
    - ^UInteger$
    - ^NSSize$
    - ^NSRect$

  ResolvedTypedefs:
    - '[su]?int.*'

  FileIncludes:
    - Name: NSObjectProtocol
      Head: |
        @(objc_type=ObjectProtocol, objc_name="safeRelease")
        safeRelease :: #force_inline proc "c" (self: ^ObjectProtocol) -> instancetype {
            if self != nil {
                self->release()
            }

            return nil
        }


  Packages:
    - Name  : Foundation
      Export: NS
      LinkLibs: [system:Foundation.framework]
      Filter: .*

      TypeMap:
        NSImage: Image

      Imports:
        - |
          OpaqueSecTransformImplementation :: struct {}
          OpaqueSecIdentitySearchRef       :: struct {}
          OpaquePolicySearchRef            :: struct {}
          Image                            :: Object

          to_ns_string :: #force_inline proc "contextless" ( str: string ) -> ^String {
              return String.alloc()->initWithBytes(raw_data(str), UInteger(len(str)), UTF8StringEncoding)
          }

          to_ns_string_no_copy :: #force_inline proc "contextless" ( str: string ) -> ^String {
              return String.alloc()->initWithBytesNoCopy(raw_data(str), UInteger(len(str)), UTF8StringEncoding, false)
          }

          to_odin_string :: proc( ns_str: ^String, allocator := context.allocator ) -> string {
              length := ns_str->lengthOfBytesUsingEncoding(UTF8StringEncoding)
              dest := make([]u8, int(length)+1, allocator)

              runtime.mem_copy_non_overlapping(raw_data(dest), rawptr(ns_str->UTF8String()), int(length))
              return string(dest[:length])
          }

          tmp_to_odin_string :: #force_inline proc ( ns_str: ^String ) -> string {
              return to_odin_string(ns_str, context.temp_allocator)
          }

          // Helper array iterator
          Array_Iterator :: struct($T: typeid) {
              array: ^Array,
              length: int,
              index:  int,
          }

          array_iter :: proc( $T: typeid, array: ^Array ) -> Array_Iterator(T) {
              return Array_Iterator(T) {
                  array  = array,
                  length = int(array->count()),
                  index  = 0,
              }
          }

          array_next :: proc( it: ^Array_Iterator($T) ) -> (val: ^T, idx: int, cond: bool) {
              if it.index >= it.length {
                  return
              }

              val      = auto_cast it.array->objectAtIndex(auto_cast it.index)
              idx      = it.index
              cond     = true
              it.index += 1
              return
          }

          STR :: #force_inline proc "contextless" ( #const s: cstring ) -> ^String {
              return auto_cast CF.STR(s)
          }

        - |
          // Composite SDK masks that also contain reserved or unnamed bits.
          DataWritingOptions_FileProtectionMask :: transmute(DataWritingOptions)cffi.ulong(4026531840)
          ActivityOptions_UserInitiated :: transmute(ActivityOptions)cffi.ulonglong(16777215)
          ActivityOptions_UserInitiatedAllowingIdleSystemSleep :: transmute(ActivityOptions)cffi.ulonglong(15728639)
          ActivityOptions_Background :: transmute(ActivityOptions)cffi.ulonglong(255)
          ActivityOptions_LatencyCritical :: transmute(ActivityOptions)cffi.ulonglong(1095216660480)
          ActivityOptions_UserInteractive :: transmute(ActivityOptions)cffi.ulonglong(1095233437695)
          ByteCountFormatterUnits_UseYBOrHigher :: transmute(ByteCountFormatterUnits)cffi.ulong(65280)
          ByteCountFormatterUnits_UseAll :: transmute(ByteCountFormatterUnits)cffi.ulong(65535)
          when ODIN_PLATFORM_SUBTARGET == .Default { XMLNodeOptions_PreserveAll :: transmute(XMLNodeOptions)cffi.ulong(4293918750) }

      # TypeMap:


  # Symbol Transformers
  EnumTransforms:
  - Type: .*
    Transforms:
    - Kind: RemoveTypeWordsFromElements
    - Kind: RemovePartialTypeNamePrefix
    - Kind: RemoveUnderscorePrefix
    - Kind: UnderscoreNumbers
    
  - Type: ^CE_GeneralNameType$
    Transforms:
    - Kind  : RemovePrefix
      Source: GNT_

  - Type: ^CE_DataType$
    Transforms:
    - Kind  : RemovePrefix
      Source: DT_

  - Type: ^CE_CrlDistributionPointNameType$
    Transforms:
    - Kind  : RemovePrefix
      Source: DNT_


  # Restore complete SDK words after the generic enum-name transforms.
  - Type: '^NSRelativeDateTimeFormatterStyle$'
    Transforms:
    - { Kind: ReplacePrefix, Source: amed, Target: Named }
    - { Kind: ReplacePrefix, Source: umeric, Target: Numeric }

  TypeTransforms:
    - Type: ^(NS).+
      Transforms:
      - Kind  : RemovePrefix
        Source: $group0
    - Type: Flag$ # Transforms for bit_set types
      Transforms:
      - Kind  : AppendSuffix
        Source: s
    - Type: Mask$
      Transforms:
      - Kind  : None

  BitSetMap:
    # SDK 27 flag declarations, verified against the headers named below.
    # NSPropertyListMutabilityOptions selects one mutability mode; keep it as an enum.
    # session.h: documented flag bits.
    - Type: '^xpc_session_create_flags_t$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # listener.h: documented flag bits.
    - Type: '^xpc_listener_create_flags_t$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSObjCRuntime.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSEnumerationOptions|NSSortOptions)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSOrderedCollectionDifference.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSOrderedCollectionDifferenceCalculationOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSArray.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSBinarySearchingOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSItemProvider.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSItemProviderFileOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSString.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSStringCompareOptions|NSStringEncodingConversionOptions|NSStringEnumerationOptions)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSCalendar.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSCalendarUnit|NSCalendarOptions)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSData.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSDataReadingOptions|NSDataWritingOptions|NSDataSearchOptions|NSDataBase64EncodingOptions)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    - Type: '^NSDataBase64DecodingOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSAttributedString.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSAttributedStringEnumerationOptions|NSInlinePresentationIntent|NSAttributedStringFormattingOptions)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSISO8601DateFormatter.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSISO8601DateFormatOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSMeasurementFormatter.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSMeasurementFormatterUnitOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSPersonNameComponentsFormatter.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSPersonNameComponentsFormatterOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSURL.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSURLBookmarkCreationOptions|NSURLBookmarkResolutionOptions)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSFileManager.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSVolumeEnumerationOptions|NSDirectoryEnumerationOptions|NSFileManagerItemReplacementOptions)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    - Type: '^(?:NSFileManagerUnmountOptions|NSFileManagerSupportedSyncControls)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSPointerFunctions.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSPointerFunctionsOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSJSONSerialization.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSJSONReadingOptions|NSJSONWritingOptions)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSKeyValueObserving.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSKeyValueObservingOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSGeometry.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSAlignmentOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSNotificationQueue.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSNotificationCoalescing$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSPort.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSMachPortOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSProcessInfo.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSActivityOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSTextCheckingResult.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSTextCheckingType$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSRegularExpression.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSRegularExpressionOptions|NSMatchingOptions)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSStream.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSStreamEvent$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSXPCConnection.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSXPCConnectionOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSByteCountFormatter.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSByteCountFormatterUnits$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSComparisonPredicate.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSComparisonPredicateOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSDateComponentsFormatter.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSDateComponentsFormatterZeroFormattingBehavior$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSFileCoordinator.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSFileCoordinatorReadingOptions|NSFileCoordinatorWritingOptions)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSFileVersion.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSFileVersionAddingOptions|NSFileVersionReplacingOptions)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSFileWrapper.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:NSFileWrapperReadingOptions|NSFileWrapperWritingOptions)$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSLinguisticTagger.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSLinguisticTaggerOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSNetServices.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSNetServiceOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSDistributedNotificationCenter.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSDistributedNotificationOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSXMLNodeOptions.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSXMLNodeOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # NSAppleEventDescriptor.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^NSAppleEventSendOptions$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    - Type: Flags?$
      Transforms:
        - Kind  : RemoveSuffix
          Source: s
    - Type: Mask$
      Transforms:
        - Kind  : AppendSuffix
          Source: Flag

  ProcTransforms:
  - Type: ^(_*NS).+
    Transforms:
    - Kind  : RemovePrefix
      Source: $group0

  VarTransforms:
    - Type: ^(_*k?NS).+
      Transforms:
        - Kind  : RemovePrefix
          Source: $group0
