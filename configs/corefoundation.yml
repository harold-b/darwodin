---

Defs: ../definitions/macos/corefoundation.json

Mono  : { Emit: false }
CSharp: { Emit: false }

Cpp:
  Emit: false
  ExportInternals: true
  DontWrapCFunctions: true
  ExportForwardDeclarations: true

  ExportTypes:
    - ^_*CF.+
    - ^_*dispatch_.+
    - ^OSErr
    - ^OSStatus
    - ^LogicalAddress
    - ^ConstLogicalAddress
    - ^PhysicalAddress
    - ^Ptr
    - ^BytePtr
    - ^ByteCount
    - ^SignedByte
    - ^ByteOffset
    - ^Duration
    - ^AbsoluteTime
    - ^OptionBits
    - ^ItemCount
    - ^PBVersion
    - ^ScriptCode
    - ^LangCode
    - ^RegionCode
    - ^FourCharCode
    - ^OSType
    - ^ResType
    - ^OSTypePtr
    - ^ResTypePtr
    - ^SRefCon
    - ^AppleEvent
    - ^Handle
    - ^Size
    - ^UInt8
    - ^SInt8
    - ^UInt16
    - ^SInt16
    - ^UInt32
    - ^SInt32
    - ^UInt64
    - ^SInt64
    # - ^Boolean
    # - ^boolean_t$
    - ^UnicodeScalarValue;
    - ^UTF32Char
    - ^UniChar
    - ^UTF16Char
    - ^UTF8Char
    - ^UniCharPtr
    - ^UniCharCount
    - ^UniCharCountPtr
    - ^Str255
    - ^Str63
    - ^Str32
    - ^Str31
    - ^Str27
    - ^Str15
    - ^Bit
    - ^StrFileName
    - ^StringPtr
    - ^StringHandle
    - ^ConstStringPtr
    - ^ConstStr255Param
    - ^ConstStr63Param
    - ^ConstStr32Param
    - ^ConstStr31Param
    - ^ConstStr27Param
    - ^ConstStr15Param
    - ^ConstStrFileNameParam
    - ^UnsignedWide
    - ^uext_object_t
    - ^unichar
    - ^[Oo][Ss]_
    - ^_opaque_
    - ^__mbstate_t
    - ^qos_class_t$


  ExportMethods:
    - ^::CF.+
    - ^::dispatch_.+
    - ^::Sec.+

  ExportVars:
    - ^::k?CF.+
    - ^::k?[Oo][Ss].+
    - ^::k?Dispatch.+
    - ^::k?dispatch.+
    - ^::DISPATCH.+
    # Public objects used by dispatch's address/value macros.
    - ^::_dispatch_(main_q|queue_attr_concurrent|source_type_.+|data_(empty|destructor_(free|munmap)))$

  IgnoreTypes  :
    - ^OS_object$
    - ^OS_os_workgroup
    - ^OS_dispatch
    - ^CFStringEncoding$

  IgnoreMethods:
    # - ^::CFStringGetBytes # Conflicts with sys/darwin/core_foundation

    # These functions are declared in the C headers but not exported by the dynamic library
    - ^::dispatch_cancel$
    - ^::dispatch_notify$
    - ^::dispatch_testcancel$
    - ^::dispatch_wait$

Odin:
  Emit           : true
  ExportPath     : ..
  BasePackageName: darwodin
  SingleFile     : false
  TargetPlatform : Darwin
  ExportTypeMapDir: ../exports

  ExternalTypes:
    - ../mach/exports/mach.exports.yml
    - ../libc/libc.exports.yml

  ExternalPackageMap:
    darwin_libc: '../libc'

  NoDistinctTypedefs: true
  # DistinctTypeDefs:  
  #   - 

  # NonDistinctTypeDefs:
  #   - ^.+Ref$

  ResolvedTypedefs:
    # - ^boolean_t$
    - ^qos_class_t$
    - CSSM_.+
    - cssm_.+
    # Keep public dispatch typedefs such as dispatch_io_interval_flags_t.
    - '^(?!dispatch_).*[su]?int.*'

  Packages:
    - Name  : CoreFoundation
      Filter: .*
      Export: CF
      LinkLibs: [system:CoreFoundation.framework]

      MacroFilter:
        - Match: '^DISPATCH_(QUEUE_PRIORITY_|MACH_SEND_|MEMORYPRESSURE_|PROC_|VNODE_|TIMER_|IO_).+'
        - Match: '^(NSEC_PER_(SEC|MSEC|USEC)|[MU]SEC_PER_SEC)$'
          File: '^time\.h$'

      Imports:
        - |
          FSRef             :: struct {}
          NSObject          :: intrinsics.objc_object
          NSString          :: NSObject
          NSMethodSignature :: NSObject
          OS_object         :: NSObject
          OS_os_workgroup   :: NSObject
          NSUInteger        :: cffi.ulong
          _NSZone           :: struct {}
          Boolean           :: b8
          boolean_t         :: b32


          KERN_SUCCESS            :: 0
          DISPATCH_TIME_NOW       :: 0
          DISPATCH_TIME_FOREVER   :: 0xFFFFFFFFFFFFFFFF

          @(default_calling_convention="c")
          foreign lib {
              @(link_name = "__CFStringMakeConstantString")
              StringMakeConstantString :: proc "c" ( c: cstring ) -> StringRef ---
          }

          STR :: StringMakeConstantString

          dispatch_get_main_queue :: proc "c" () -> dispatch_queue_main_t {
              return &_dispatch_main_q
          }

          DISPATCH_QUEUE_PRIORITY_LOW        :: -2
          DISPATCH_QUEUE_PRIORITY_BACKGROUND :: -32768

          DISPATCH_APPLY_AUTO              := dispatch_queue_t(nil)
          DISPATCH_QUEUE_SERIAL            := dispatch_queue_attr_t(nil)
          DISPATCH_TARGET_QUEUE_DEFAULT    := dispatch_queue_t(nil)
          DISPATCH_CURRENT_QUEUE_LABEL     := dispatch_queue_t(nil)
          DISPATCH_DATA_DESTRUCTOR_DEFAULT := dispatch_block_t(nil)

          DISPATCH_QUEUE_CONCURRENT := &_dispatch_queue_attr_concurrent
          dispatch_data_empty       := &_dispatch_data_empty

          DISPATCH_SOURCE_TYPE_DATA_ADD       := &_dispatch_source_type_data_add
          DISPATCH_SOURCE_TYPE_DATA_OR        := &_dispatch_source_type_data_or
          DISPATCH_SOURCE_TYPE_DATA_REPLACE   := &_dispatch_source_type_data_replace
          DISPATCH_SOURCE_TYPE_MACH_SEND      := &_dispatch_source_type_mach_send
          DISPATCH_SOURCE_TYPE_MACH_RECV      := &_dispatch_source_type_mach_recv
          DISPATCH_SOURCE_TYPE_MEMORYPRESSURE := &_dispatch_source_type_memorypressure
          DISPATCH_SOURCE_TYPE_PROC           := &_dispatch_source_type_proc
          DISPATCH_SOURCE_TYPE_READ           := &_dispatch_source_type_read
          DISPATCH_SOURCE_TYPE_SIGNAL         := &_dispatch_source_type_signal
          DISPATCH_SOURCE_TYPE_TIMER          := &_dispatch_source_type_timer
          DISPATCH_SOURCE_TYPE_VNODE          := &_dispatch_source_type_vnode
          DISPATCH_SOURCE_TYPE_WRITE          := &_dispatch_source_type_write

          DISPATCH_DATA_DESTRUCTOR_FREE   := _dispatch_data_destructor_free
          DISPATCH_DATA_DESTRUCTOR_MUNMAP := _dispatch_data_destructor_munmap

          DISPATCH_QUEUE_SERIAL_INACTIVE :: proc "c" () -> dispatch_queue_attr_t {
              return dispatch_queue_attr_make_initially_inactive(DISPATCH_QUEUE_SERIAL)
          }

          DISPATCH_QUEUE_CONCURRENT_INACTIVE :: proc "c" () -> dispatch_queue_attr_t {
              return dispatch_queue_attr_make_initially_inactive(DISPATCH_QUEUE_CONCURRENT)
          }

          DISPATCH_QUEUE_SERIAL_WITH_AUTORELEASE_POOL :: proc "c" () -> dispatch_queue_attr_t {
              return dispatch_queue_attr_make_with_autorelease_frequency(DISPATCH_QUEUE_SERIAL, .WORK_ITEM)
          }

          DISPATCH_QUEUE_CONCURRENT_WITH_AUTORELEASE_POOL :: proc "c" () -> dispatch_queue_attr_t {
              return dispatch_queue_attr_make_with_autorelease_frequency(DISPATCH_QUEUE_CONCURRENT, .WORK_ITEM)
          }

          dispatch_cancel :: proc{
              dispatch_block_cancel,
              dispatch_source_cancel,
          }

          dispatch_notify :: proc{
              dispatch_block_notify,
              dispatch_group_notify,
          }

          dispatch_testcancel :: proc{
              dispatch_block_testcancel,
              dispatch_source_testcancel,
          }

          dispatch_wait :: proc{
              dispatch_block_wait,
              dispatch_group_wait,
              dispatch_semaphore_wait,
          }

          StringCopyToOdinString :: proc( theString: StringRef, allocator := context.allocator ) -> (str: string, ok: bool) #optional_ok {
              length := StringGetLength(theString)
              max    := StringGetMaximumSizeForEncoding(length, StringEncoding(StringBuiltInEncodings.UTF8))

              buf, err := make([]byte, max, allocator)
              if err != nil {
                  return
              }

              n: Index
              StringGetBytes(theString, {0, length}, StringEncoding(StringBuiltInEncodings.UTF8), 0, false, raw_data(buf), Index(len(buf)), &n)
              return string(buf[:n]), true
          }



        - |
          // Composite SDK masks that also contain reserved or unnamed bits.
          RunLoopActivity_AllActivities :: transmute(RunLoopActivity)cffi.ulong(268435455)
          when ODIN_PLATFORM_SUBTARGET == .Default { XMLParserOptions_AllOptions :: transmute(XMLParserOptions)cffi.ulong(16777215) }

      TypeMap:
        NSObject:          NSObject
        NSMethodSignature: NSMethodSignature
        NSString:          NSString
        NSUInteger:        NSUInteger
        _NSZone:           _NSZone
        OS_object:         OS_object
        OS_os_workgroup:   OS_os_workgroup
        Boolean:           Boolean
        CFStringEncoding:  StringEncoding

      # ExternalTypes:


  # Symbol Transformers
  EnumTransforms:
  - Type: ^CFURLBookmarkResolutionOptions$
    Transforms:
    - Kind  : ReplacePrefix
      Source: kCFBookmarkResolution
      Target: _k
  
  - Type: ^(CFURL|CFXML).+
    Transforms:
      - Kind  : RemovePrefix
        Source: k
      - Kind  : RemovePrefix
        Source: CFBookmarkResolution
      - Kind  : RemoveTypeWordsFromElements
  - Type: ^CFComparisonResult$
    Transforms:
      - Kind  : RemovePrefix
        Source: kCFCompare
  - Type: ^CFStringBuiltInEncodings$
    Transforms:
      - Kind  : RemovePrefix
        Source: kCFStringEncoding
  - Type: ^CFISO8601DateFormatOptions$
    Transforms:
      - Kind  : RemovePrefix
        Source: kCFISO8601DateFormatWith

  - Type: ^CFStringEncodings$
    Transforms:
      - Kind  : RemovePrefix
        Source: kCFStringEncoding

  - Type: ^(CF).+
    Transforms:
      - Kind  : RemovePrefix
        Source: kCF
  - Type: .*
    Transforms:
      - Kind  : RemoveTypeWordsFromElements
      - Kind  : RemovePartialTypeNamePrefix
      - Kind  : RemoveUnderscorePrefix
      - Kind  : UnderscoreNumbers

  # Restore complete SDK words after the generic enum-name transforms.
  - Type: '^CFGregorianUnitFlags$'
    Transforms:
    - { Kind: ReplacePrefix, Source: sYears, Target: Years }
    - { Kind: ReplacePrefix, Source: sMonths, Target: Months }
    - { Kind: ReplacePrefix, Source: sDays, Target: Days }
    - { Kind: ReplacePrefix, Source: sHours, Target: Hours }
    - { Kind: ReplacePrefix, Source: sMinutes, Target: Minutes }
    - { Kind: ReplacePrefix, Source: sSeconds, Target: Seconds }

  TypeTransforms:
    - Type: ^CFStringEncodings$
      Transforms:
      - Kind  : RemoveSuffix
        Source: s
    - Type: ^(CF(?!AbsoluteTime)).+
      Transforms:
        - Kind  : RemovePrefix
          Source: $group0
    - Type: Flag$ # Transforms for bit_set types
      Transforms:
      - Kind  : AppendSuffix
        Source: s
    - Type: Mask$
      Transforms:
      - Kind  : None
      

  BitSetMap:
    # SDK 27 flag declarations, verified against the headers named below.
    # CFPropertyListMutabilityOptions and CFXMLParserStatusCode select modes/statuses, not flags.
    # block.h: documented flag bits.
    - Type: '^dispatch_block_flags_t$'
      Transforms: [{ Kind: ReplaceSuffix, Source: flags_t, Target: flag }]
    # CFCalendar.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CFCalendarUnit$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # CFDateFormatter.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CFISO8601DateFormatOptions$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    # CFURL.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^(?:CFURLBookmarkCreationOptions|CFURLBookmarkResolutionOptions)$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    # CFRunLoop.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CFRunLoopActivity$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # CFSocket.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CFSocketCallBackType$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # CFStream.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CFStreamEventType$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # CFURLEnumerator.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CFURLEnumeratorOptions$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    # CFFileSecurity.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CFFileSecurityClearOptions$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    # CFStringTokenizer.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CFStringTokenizerTokenType$'
      Transforms: [{ Kind: AppendSuffix, Source: Flag }]
    # CFXMLParser.h: NS_OPTIONS / CF_OPTIONS.
    - Type: '^CFXMLParserOptions$'
      Transforms: [{ Kind: RemoveSuffix, Source: s }]
    - Type: Flags?$
      Transforms:
        - Kind  : RemoveSuffix
          Source: s
    - Type: Mask$
      Transforms:
        - Kind  : ReplaceSuffix
          Source: Mask
          Target: Flag
 
  ProcTransforms:
  - Type: ^(_*CF).+
    Transforms:
      - Kind  : RemovePrefix
        Source: $group0

  VarTransforms:
    # - Type: ^(kCFLocaleIdentifier|kCFNumberFormatterRoundingMode)$
    - Type: ^kCF.+
      Transforms:
        - Kind  : ReplacePrefix
          Source: kCF
          Target: k
    - Type: ^_kCF.+
      Transforms:
        - Kind  : ReplacePrefix
          Source: _kCF
          Target: k
