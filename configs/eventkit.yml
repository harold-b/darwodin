---

Defs: ../definitions/macos/eventkit.json

Mono  : { Emit: false }
CSharp: { Emit: false }

Cpp:
  Emit: false
  ExportInternals: true
  DontWrapCFunctions: true
  ExportForwardDeclarations: true
  
  ExportTypes:
    - ^_*EK.+

  ExportMethods:
    - ^::EK.+

  ExportVars:
    - ^::k?EK.+

  IgnoreTypes  : []
  IgnoreMethods: []


Odin:
  Emit           : true
  ExportPath     : ..
  BasePackageName: darwodin
  SingleFile     : false
  TargetPlatform : Darwin
  ExportTypeMapDir: ../exports
  ExternalTypes:
    - ../exports/CoreFoundation.exports.yml
    - ../exports/CoreGraphics.exports.yml
    - ../exports/AppKit.exports.yml
    - ../exports/CoreLocation.exports.yml
    - ../exports/MapKit.exports.yml

  NoDistinctTypedefs: true
  ResolvedTypedefs:
    - '[su]?int.*'

  Packages:
    - Name  : EventKit
      Export: EK
      RequiredLink: true # TODO: Remove this if we are able to link when using objc_method calls
      LinkLibs: [system:EventKit.framework]
      NoCanonicalRelativeLinkPath: true
      Filter: .*

      Imports:
        - |
          ABAddressBook:: NS.Object
          ABPerson::      NS.Object

          ABAddressBookRef :: CF.TypeRef
          when ODIN_PLATFORM_SUBTARGET_IOS {
              ABRecordRef      :: CF.TypeRef
          } else {
              ABRecordRef      :: rawptr
          }

      # TypeMap:

      IgnoreEnumItems:
        - ^EKWeekday::EKWeekday.+day$


  # Symbol Transformers
  EnumTransforms:
    - Type: .*
      Transforms:
      - Kind: RemoveTypeWordsFromElements
      - Kind: RemovePartialTypeNamePrefix
      - Kind: RemoveUnderscorePrefix
      - Kind: UnderscoreNumbers

  TypeTransforms:
    - Type: ^(EK).+
      Transforms:
      - Kind  : RemovePrefix
        Source: $group0
    - Type: (Flag|Option|Mask)$  # Transforms for bit_set types
      Transforms:
      - Kind  : AppendSuffix
        Source: s

  BitSetMap:
    - Type: (Mask|Flags?|Options?)$ # Transforms the enum that will generate a bit_set to not have a collision type
      Transforms:
        - Kind  : RemoveSuffix
          Source: s
 
  ProcTransforms:
  - Type: ^(_*EK).+
    Transforms:
    - Kind  : RemovePrefix
      Source: $group0

  VarTransforms:
    - Type: ^(_*EK).+
      Transforms:
        - Kind  : RemovePrefix
          Source: $group0
